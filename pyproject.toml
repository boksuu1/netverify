[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netverify"
version = "0.2.0"
description = "Checks whether the network you are on tampers with your traffic"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
netverify = "netverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
